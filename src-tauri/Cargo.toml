[package]
name = "student_roster"
version = "0.1.3"
description = "학생명단 관리 시스템"
authors = ["lohemal"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "student_roster_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
calamine = { version = "0.36", features = ["dates"] }
rust_xlsxwriter = { version = "0.92.0", features = ["chrono"] }
tauri-plugin-updater = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
